spring.application.name=pretest
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Cierra la sesión de BD al terminar cada servicio (los controladores solo reciben DTOs).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET}

# AletheIA (servicio de verificación). La clave solo se lee del entorno; sin ella no arranca.
aletheia.url=${ALETHEIA_URL:http://127.0.0.1:8000}
aletheia.api-key=${ALETHEIA_API_CLAVE:}
aletheia.timeout-conexion=5s
aletheia.timeout-lectura=30s
aletheia.intervalo-consulta=10s
aletheia.tiempo-maximo-pendiente=10m
aletheia.espera-reintento=1m